name: Format check

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.10"
            cache: "pip"

      - name: Install Python formatter
        run: pip install black

      - name: Check Rust format (db)
        working-directory: ./db
        run: cargo fmt --check

      - name: Check Rust format (route_macro)
        working-directory: ./db/lib/route_macro
        run: cargo fmt --check

      - name: Check Python format
        run: black --check --diff .

