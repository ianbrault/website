name: Format check

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.1
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Install packages
        run: pip install black && npm install --all

      - name: Check Rust format (db)
        working-directory: ./db
        run: cargo fmt --check

      - name: Check Rust format (route_macro)
        working-directory: ./db/lib/route_macro
        run: cargo fmt --check

      - name: Check Python format
        run: black --check --diff .

      - name: Check JavaScript, TypeScript, JSON format
        run: npx prettier --check .
