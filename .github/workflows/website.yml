name: Website

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Install packages
        run: npm install --all

      - name: Run ESLint
        run: npx eslint .

      - name: Build website
        run: npx next build --turbopack
