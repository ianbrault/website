[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "website"
version = "0.2.0"
requires-python = ">=3.9"
readme = "README.md"

dependencies = [
    "black",
    "pymongo",
    "pytest",
    "requests",
]

[project.scripts]
website-start = "tools.start:main"

[tool.setuptools]
packages = [
    "tests",
    "tools.common",
]

[tool.pytest]
log_cli = true
log_cli_level = "INFO"
testpaths = [
    "tests",
]

[tool.black]
line-length = 80
target-version = ["py38"]
