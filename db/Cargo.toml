[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
axum = "0.8.8"
bson = "3.1.0"
clap = { version = "4.5.58", features = ["derive", "env"] }
futures = "0.3.31"
log = "0.4.29"
mongodb = { version = "3.5.1", features = ["bson-3"] }
scrypt = "0.11.0"
serde = "1.0.228"
simplelog = "0.12.2"
tokio = { version = "1.49.0", features = ["full"] }
uuid = "1.21.0"
