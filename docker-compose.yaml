services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        - MONGODB_URL=mongodb://database:27017
        - PORT=3000
    container_name: app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_started
    environment:
      MONGODB_URL: mongodb://database:27017
      PORT: 3000

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
      args:
        - MONGODB_URL=mongodb://database:27017
        - PORT=4000
    container_name: db
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_started
    environment:
      MONGODB_URL: mongodb://database:27017
      PORT: 4000

  database:
    image: mongo
    container_name: database
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - db-data:/data/db
    command: mongod --quiet --logpath /dev/null

volumes:
  db-data: